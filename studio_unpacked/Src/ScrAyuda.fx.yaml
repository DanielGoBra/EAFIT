ScrAyuda As screen:
    Fill: =RGBA(238, 244, 252, 1)

    RctHdrAyu As rectangle.ManualInput:
        Fill: =RGBA(15, 61, 115, 1)
        Height: =72
        Width: =Parent.Width

    LblTitleAyu As label.Label:
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Bold
        Height: =72
        Size: =17
        Text: ="Manual de Usuario"
        Width: =Parent.Width-68
        X: =58

    RctBackAyu As rectangle.ManualInput:
        Fill: =RGBA(46, 123, 196, 1)
        Height: =40
        OnSelect: =Navigate(Screen1,ScreenTransition.Slide)
        Width: =44
        X: =4
        Y: =16

    LblBackAyu As label.Label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        OnSelect: =Navigate(Screen1,ScreenTransition.Slide)
        Size: =22
        Text: ="←"
        Width: =44
        X: =4
        Y: =16

    RctAccentAyu As rectangle.ManualInput:
        Fill: =RGBA(247, 181, 0, 1)
        Height: =3
        Width: =Parent.Width
        Y: =72

    RctHelpCard As rectangle.ManualInput:
        BorderColor: =RGBA(203, 213, 225, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height - ${CONTENT_Y + 20}
        Width: =Parent.Width - 40
        X: =20
        Y: =91

    LblHelpDocente As label.Label:
        Color: =RGBA(26, 39, 66, 1)
        Height: =Parent.Height - ${CONTENT_Y + 52}
        Text: ="✅ RESERVAR MATERIAL" & Char(10) &"1. Ve a Reservas y presiona +" & Char(10) &"2. Selecciona material, fecha y bloque horario" & Char(10) &"3. Confirma tu reserva" & Char(10) & Char(10) &"⏰ MIS PRÉSTAMOS" & Char(10) &"Ve los materiales que tienes prestados y su fecha de devolución." & Char(10) & Char(10) &"❌ CANCELAR RESERVA" & Char(10) &"Puedes cancelar hasta 30 minutos antes del inicio." & Char(10) & Char(10) &"⚠️ IMPORTANTE" & Char(10) &"Devuelve el material al finalizar tu bloque horario."
        VerticalAlign: =VerticalAlign.Top
        Visible: =gRol = "Docente" || gRol = "Invitado"
        Width: =Parent.Width - 72
        X: =36
        Y: =107

    LblHelpAdmin As label.Label:
        Color: =RGBA(26, 39, 66, 1)
        Height: =Parent.Height - ${CONTENT_Y + 52}
        Text: |-
            ="📝 REGISTRAR RETIRO" & Char(10) &"1. Ve a Préstamos y presiona +" & Char(10) &"2. Tipo: Retiro, ingresa artículo y docente" & Char(10) &"3. Define fecha de devolución esperada" & Char(10) & Char(10) &"✅ REGISTRAR DEVOLUCIÓN" & Char(10) &"Edita el préstamo activo y cambia Tipo a Devolución." & Char(10) & Char(10) &"🚨 ALERTAS" & Char(10) &"Revisa ScrAlertas para ver préstamos vencidos." & Char(10) & Char(10) &"📊 REPORTES" & Char(10) &"Filtra por período y consulta uso por docente/material."
        VerticalAlign: =VerticalAlign.Top
        Visible: =gRol = "Admin" || gRol = "SuperAdmin"
        Width: =Parent.Width - 72
        X: =36
        Y: =107

