ScrPrestamos As screen:
    Fill: =RGBA(238, 244, 252, 1)
    OnVisible: |-
        =Refresh(Prestamos)

    RctHdrPst As rectangle.ManualInput:
        Fill: =RGBA(15, 61, 115, 1)
        Height: =148
        Width: =Parent.Width

    RctBackPst As rectangle.ManualInput:
        Fill: =RGBA(46, 123, 196, 1)
        Height: =40
        OnSelect: =Navigate(Screen1,ScreenTransition.None)
        RadiusBottomLeft: =12
        RadiusBottomRight: =12
        RadiusTopLeft: =12
        RadiusTopRight: =12
        Width: =100
        X: =20
        Y: =24

    LblBackPst As label.Label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Semibold
        OnSelect: =Navigate(Screen1,ScreenTransition.None)
        Size: =13
        Text: ="← Volver"
        Width: =100
        X: =20
        Y: =24

    LblTitlePst As label.Label:
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Bold
        Height: =38
        Size: =20
        Text: =If(gRol="Docente","Mis prestamos","Retiros y devoluciones")
        Width: =Parent.Width - 144
        X: =128
        Y: =24

    LblSubtitlePst As label.Label:
        Color: =RGBA(220, 232, 248, 1)
        Height: =22
        Size: =12
        Text: =If(gRol="Docente","Consulta el estado de tus materiales y sus fechas de devolucion.","Gestiona retiros, devoluciones y pendientes del laboratorio.")
        Width: =Parent.Width - 48
        X: =24
        Y: =72

    LblSummaryPst As label.Label:
        Color: =RGBA(220, 232, 248, 1)
        Height: =20
        Size: =11
        Text: =If(gFiltroPrestamo="Todos","Filtra por estado para ubicar retiros activos o vencidos.","Vista filtrada por estado: " & gFiltroPrestamo)
        Width: =Parent.Width - 96
        X: =24
        Y: =98

    RctAccentPst As rectangle.ManualInput:
        Fill: =RGBA(247, 181, 0, 1)
        Height: =4
        Width: =Parent.Width
        Y: =148

    RctFltTodosPst As rectangle.ManualInput:
        BorderThickness: =0
        Fill: =If(gFiltroPrestamo="Todos",RGBA(26, 92, 168, 1),RGBA(255, 255, 255, 0.92))
        Height: =40
        OnSelect: =Set(gFiltroPrestamo,"Todos")
        RadiusBottomLeft: =14
        RadiusBottomRight: =14
        RadiusTopLeft: =14
        RadiusTopRight: =14
        Width: =(Parent.Width - 56) / 4
        X: =20
        Y: =166

    LblFltTodosPst As label.Label:
        Align: =Align.Center
        Color: =If(gFiltroPrestamo="Todos",RGBA(255, 255, 255, 1),RGBA(26, 92, 168, 1))
        FontWeight: =FontWeight.Semibold
        Height: =40
        OnSelect: =Set(gFiltroPrestamo,"Todos")
        Size: =12
        Text: ="Todos"
        Width: =(Parent.Width - 56) / 4
        X: =20
        Y: =166

    RctFltActivoPst As rectangle.ManualInput:
        BorderThickness: =0
        Fill: =If(gFiltroPrestamo="Activo",RGBA(26, 92, 168, 1),RGBA(255, 255, 255, 0.92))
        Height: =40
        OnSelect: =Set(gFiltroPrestamo,"Activo")
        RadiusBottomLeft: =14
        RadiusBottomRight: =14
        RadiusTopLeft: =14
        RadiusTopRight: =14
        Width: =(Parent.Width - 56) / 4
        X: =20 + 1 * ((Parent.Width - 56) / 4 + 8)
        Y: =166

    LblFltActivoPst As label.Label:
        Align: =Align.Center
        Color: =If(gFiltroPrestamo="Activo",RGBA(255, 255, 255, 1),RGBA(26, 92, 168, 1))
        FontWeight: =FontWeight.Semibold
        Height: =40
        OnSelect: =Set(gFiltroPrestamo,"Activo")
        Size: =12
        Text: ="Activos"
        Width: =(Parent.Width - 56) / 4
        X: =20 + 1 * ((Parent.Width - 56) / 4 + 8)
        Y: =166

    RctFltVencidoPst As rectangle.ManualInput:
        BorderThickness: =0
        Fill: =If(gFiltroPrestamo="Vencido",RGBA(26, 92, 168, 1),RGBA(255, 255, 255, 0.92))
        Height: =40
        OnSelect: =Set(gFiltroPrestamo,"Vencido")
        RadiusBottomLeft: =14
        RadiusBottomRight: =14
        RadiusTopLeft: =14
        RadiusTopRight: =14
        Width: =(Parent.Width - 56) / 4
        X: =20 + 2 * ((Parent.Width - 56) / 4 + 8)
        Y: =166

    LblFltVencidoPst As label.Label:
        Align: =Align.Center
        Color: =If(gFiltroPrestamo="Vencido",RGBA(255, 255, 255, 1),RGBA(26, 92, 168, 1))
        FontWeight: =FontWeight.Semibold
        Height: =40
        OnSelect: =Set(gFiltroPrestamo,"Vencido")
        Size: =12
        Text: ="Vencidos"
        Width: =(Parent.Width - 56) / 4
        X: =20 + 2 * ((Parent.Width - 56) / 4 + 8)
        Y: =166

    RctFltDevueltoPst As rectangle.ManualInput:
        BorderThickness: =0
        Fill: =If(gFiltroPrestamo="Devuelto",RGBA(26, 92, 168, 1),RGBA(255, 255, 255, 0.92))
        Height: =40
        OnSelect: =Set(gFiltroPrestamo,"Devuelto")
        RadiusBottomLeft: =14
        RadiusBottomRight: =14
        RadiusTopLeft: =14
        RadiusTopRight: =14
        Width: =(Parent.Width - 56) / 4
        X: =20 + 3 * ((Parent.Width - 56) / 4 + 8)
        Y: =166

    LblFltDevueltoPst As label.Label:
        Align: =Align.Center
        Color: =If(gFiltroPrestamo="Devuelto",RGBA(255, 255, 255, 1),RGBA(26, 92, 168, 1))
        FontWeight: =FontWeight.Semibold
        Height: =40
        OnSelect: =Set(gFiltroPrestamo,"Devuelto")
        Size: =12
        Text: ="Devueltos"
        Width: =(Parent.Width - 56) / 4
        X: =20 + 3 * ((Parent.Width - 56) / 4 + 8)
        Y: =166

    RctFabPst As rectangle.ManualInput:
        Fill: =RGBA(15, 61, 115, 1)
        Height: =58
        OnSelect: =Set(gItemEdit,Blank());Navigate(ScrItemFormPrestamo,ScreenTransition.None)
        RadiusBottomLeft: =18
        RadiusBottomRight: =18
        RadiusTopLeft: =18
        RadiusTopRight: =18
        Visible: =(gRol="Admin" || gRol="SuperAdmin") && IsBlank(DataTable4.Selected.NumeroTransaccion)
        Width: =58
        X: =Parent.Width - 78
        Y: =Parent.Height - 86

    LblFabPst As label.Label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Bold
        Height: =58
        OnSelect: =Set(gItemEdit,Blank());Navigate(ScrItemFormPrestamo,ScreenTransition.None)
        Size: =28
        Text: ="+"
        Visible: =(gRol="Admin" || gRol="SuperAdmin") && IsBlank(DataTable4.Selected.NumeroTransaccion)
        Width: =58
        X: =Parent.Width - 78
        Y: =Parent.Height - 86

    RctActBarPst As rectangle.ManualInput:
        BorderThickness: =0
        Fill: =RGBA(255, 255, 255, 1)
        Height: =84
        RadiusTopLeft: =20
        RadiusTopRight: =20
        Visible: =!IsBlank(DataTable4.Selected.NumeroTransaccion)
        Width: =Parent.Width
        Y: =Parent.Height - 84

    LblActNamePst As label.Label:
        Color: =RGBA(15, 61, 115, 1)
        FontWeight: =FontWeight.Semibold
        Height: =84
        Size: =13
        Text: =DataTable4.Selected.MaterialNombre & " · " & DataTable4.Selected.EstadoVisual
        Visible: =!IsBlank(DataTable4.Selected.NumeroTransaccion)
        Width: =Parent.Width - 168
        X: =20
        Y: =Parent.Height - 84

    RctEditBtnPst As rectangle.ManualInput:
        Fill: =RGBA(26, 92, 168, 1)
        Height: =48
        OnSelect: =Set(gItemEdit,LookUp(Prestamos,NumeroTransaccion=DataTable4.Selected.NumeroTransaccion));Navigate(ScrItemFormPrestamo,ScreenTransition.None)
        RadiusBottomLeft: =10
        RadiusBottomRight: =10
        RadiusTopLeft: =10
        RadiusTopRight: =10
        Visible: =!IsBlank(DataTable4.Selected.NumeroTransaccion) && gRol <> "Docente" && (DataTable4.Selected.EstadoVisual="Activo" || DataTable4.Selected.EstadoVisual="Vencido")
        Width: =78
        X: =Parent.Width - 156
        Y: =Parent.Height - 66

    LblEditBtnPst As label.Label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Semibold
        Height: =48
        OnSelect: =Set(gItemEdit,LookUp(Prestamos,NumeroTransaccion=DataTable4.Selected.NumeroTransaccion));Navigate(ScrItemFormPrestamo,ScreenTransition.None)
        Size: =12
        Text: ="Abrir"
        Visible: =RctEditBtnPst.Visible
        Width: =78
        X: =Parent.Width - 156
        Y: =Parent.Height - 66

    DataTable4 As dataTable.datatable:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.Solid
        Color: =RGBA(50, 49, 48, 1)
        DisabledColor: =RGBA(161, 159, 157, 1)
        DisplayMode: =DisplayMode.Edit
        Fill: =RGBA(0, 0, 0, 0)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Normal
        HeadingColor: =RGBA(255, 255, 255, 1)
        HeadingFill: =RGBA(15, 61, 115, 1)
        HeadingFont: =Font.'Segoe UI'
        HeadingFontWeight: =FontWeight.Normal
        HeadingSize: =13
        Height: =Parent.Height - 230 - If(!IsBlank(DataTable4.Selected.NumeroTransaccion),92,24)
        HoverColor: =RGBA(15, 61, 115, 1)
        HoverFill: =RGBA(220, 232, 248, 1)
        InputFill: =RGBA(245, 245, 245, 1)
        InvertedColor: =RGBA(255, 255, 255, 1)
        Items: =SortByColumns(With({_prestamosBase:AddColumns(If(gRol="Docente",Filter(Prestamos,Lower(Trim(Coalesce(DocenteEmail,"")))=gUserEmailNorm),Prestamos),EstadoVisual,If(Coalesce(Estado,"")="Devuelto","Devuelto",If(!IsBlank(FechaDevolucionEsperada) && DateTimeValue(FechaDevolucionEsperada)<Now(),"Vencido",Coalesce(Estado,"Activo"))))},If(gFiltroPrestamo="Todos",_prestamosBase,Filter(_prestamosBase,EstadoVisual=gFiltroPrestamo))),"FechaRetiro",SortOrder.Descending)
        LinkColor: =RGBA(0, 120, 212, 1)
        PrimaryColor1: =RGBA(26, 92, 168, 1)
        PrimaryColor2: =RGBA(46, 123, 196, 1)
        PrimaryColor3: =RGBA(15, 61, 115, 1)
        SelectedColor: =RGBA(15, 61, 115, 1)
        SelectedFill: =RGBA(220, 232, 248, 1)
        Size: =13
        Width: =Parent.Width - 40
        X: =20
        Y: =222
        ZIndex: =1

        DataTable4_NumeroTransaccion_Columna1 As dataTableColumn.textualColumn:
            DisplayMode: =DisplayMode.Edit
            FieldDisplayName: ="Transaccion"
            FieldName: ="NumeroTransaccion"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            LayoutHeight: =Parent.Height
            Order: =1
            Text: =ThisItem.NumeroTransaccion
            Width: =180
            X: =0
            Y: =0
            ZIndex: =0

        DataTable4_MaterialNombre_Columna2 As dataTableColumn.textualColumn:
            DisplayMode: =DisplayMode.Edit
            FieldDisplayName: ="Material"
            FieldName: ="MaterialNombre"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            LayoutHeight: =Parent.Height
            Order: =2
            Text: =ThisItem.MaterialNombre
            Width: =220
            X: =0
            Y: =0
            ZIndex: =0

        DataTable4_DocenteNombre_Columna3 As dataTableColumn.textualColumn:
            DisplayMode: =DisplayMode.Edit
            FieldDisplayName: ="Docente"
            FieldName: ="DocenteNombre"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            LayoutHeight: =Parent.Height
            Order: =3
            Text: =ThisItem.DocenteNombre
            Width: =200
            X: =0
            Y: =0
            ZIndex: =0

        DataTable4_FechaDevolucionEsperada_Columna4 As dataTableColumn.textualColumn:
            DisplayMode: =DisplayMode.Edit
            FieldDisplayName: ="Devolucion esperada"
            FieldName: ="FechaDevolucionEsperada"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            LayoutHeight: =Parent.Height
            Order: =4
            Text: =ThisItem.FechaDevolucionEsperada
            Width: =200
            X: =0
            Y: =0
            ZIndex: =0

        DataTable4_Estado_Columna5 As dataTableColumn.textualColumn:
            DisplayMode: =DisplayMode.Edit
            FieldDisplayName: ="Estado"
            FieldName: ="EstadoVisual"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            LayoutHeight: =Parent.Height
            Order: =5
            Text: =ThisItem.EstadoVisual
            Width: =120
            X: =0
            Y: =0
            ZIndex: =0

