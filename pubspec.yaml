name: idiomas_recursos
description: "Sistema de Gestión de Recursos - Escuela de Idiomas EAFIT"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: ^0.20.2
  table_calendar: ^3.1.2
  fl_chart: ^0.69.0
  uuid: ^4.5.1
  skeletonizer: ^2.1.3
  flutter_slidable: ^4.0.3
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  awesome_snackbar_content: ^0.1.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  font_awesome_flutter: ^11.0.0
  auto_animated: ^3.2.0
  dio: ^5.9.2
  image_picker: ^1.2.1
  flutter_tts: ^4.0.0
  speech_to_text: ^7.0.0
  sqflite_common_ffi: ^2.3.4
  sqflite_common_ffi_web: ^0.4.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/eafit_logo.png"
  adaptive_icon_background: "#1A5CA8"
  adaptive_icon_foreground: "assets/images/eafit_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
