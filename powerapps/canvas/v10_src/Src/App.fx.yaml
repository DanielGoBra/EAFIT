App As appinfo:
    BackEnabled: =true
    StartScreen: =If(EndsWith(Lower(Trim(User().Email)), "@eafit.edu.co"), Screen1, ScrLogin)
    OnStart: |-
        =Set(gUser,User());
        Set(gUserEmailNorm,Lower(Trim(User().Email)));
        ClearCollect(colUsuariosBootstrap,{Email:"dfgomezb@eafit.edu.co",Nombre:"Daniel Felipe Gómez Bravo",Rol:"SuperAdmin",Activo:"TRUE"},{Email:"cnaranj8@eafit.edu.co",Nombre:"Carlos Andrés Naranjo",Rol:"Docente",Activo:"TRUE"},{Email:"amvelasqa1@eafit.edu.co",Nombre:"Angela Maria Velasquez Acosta",Rol:"Docente",Activo:"TRUE"});
