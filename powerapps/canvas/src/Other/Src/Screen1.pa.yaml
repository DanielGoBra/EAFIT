Screens:
  Screen1:
    Control: Screen
    Properties:
      Fill: =RGBA(238, 244, 252, 1)
    Children:
      - RctHeader:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =72
            Fill: =RGBA(26, 92, 168, 1)
            BorderThickness: =0
      - LblEscuela:
          Control: Label@2.2.1
          Properties:
            X: =20
            Y: =10
            Width: =500
            Height: =22
            Text: ="Escuela de Idiomas · Universidad EAFIT"
            Color: =RGBA(255, 255, 255, 0.75)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
            FontWeight: =FontWeight.Semibold
      - LblAppTitle:
          Control: Label@2.2.1
          Properties:
            X: =20
            Y: =30
            Width: =500
            Height: =34
            Text: ="Control de Recursos"
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =20
            FontWeight: =FontWeight.Bold
      - LblUser:
          Control: Label@2.2.1
          Properties:
            X: =Parent.Width - 320
            Y: =22
            Width: =300
            Height: =28
            Text: =User().FullName
            Color: =RGBA(255, 255, 255, 0.9)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =12
            Align: =Align.Right
      - RctSubBar:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =0
            Y: =72
            Width: =Parent.Width
            Height: =36
            Fill: =RGBA(15, 61, 115, 1)
            BorderThickness: =0
      - LblSubBarText:
          Control: Label@2.2.1
          Properties:
            X: =20
            Y: =72
            Width: =700
            Height: =36
            Text: ="Sistema de Gestion · Recursos de Idiomas"
            Color: =RGBA(255, 255, 255, 0.7)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
            FontWeight: =FontWeight.Semibold
      - LblSubBarDate:
          Control: Label@2.2.1
          Properties:
            X: =Parent.Width - 320
            Y: =72
            Width: =300
            Height: =36
            Text: =Text(Today(), "[$-es-CO]dddd dd 'de' mmmm yyyy")
            Color: =RGBA(247, 181, 0, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
            FontWeight: =FontWeight.Semibold
            Align: =Align.Right
      - RctCard1:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =16
            Y: =120
            Width: =659
            Height: =300
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =1
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
      - RctCard1Bar:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =16
            Y: =120
            Width: =6
            Height: =300
            Fill: =RGBA(26, 92, 168, 1)
            BorderThickness: =0
            RadiusTopLeft: =12
            RadiusBottomLeft: =12
      - LblCard1Title:
          Control: Label@2.2.1
          Properties:
            X: =32
            Y: =148
            Width: =627
            Height: =36
            Text: ="Inventario de Materiales"
            Color: =RGBA(15, 61, 115, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =18
            FontWeight: =FontWeight.Bold
      - LblCard1Desc:
          Control: Label@2.2.1
          Properties:
            X: =32
            Y: =186
            Width: =627
            Height: =44
            Text: ="Consulta libros, equipos y recursos disponibles para docentes"
            Color: =RGBA(107, 112, 128, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =12
            Wrap: =true
      - LblCard1Stats:
          Control: Label@2.2.1
          Properties:
            X: =32
            Y: =262
            Width: =600
            Height: =30
            Text: =CountRows(gColInventario) & " articulos · " & CountIf(gColInventario, estado="Disponible") & " disponibles"
            Color: =RGBA(107, 112, 128, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
      - BtnCard1:
          Control: Button@1.0.0
          Properties:
            X: =16
            Y: =120
            Width: =659
            Height: =300
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(26, 92, 168, 0.04)
            PressedFill: =RGBA(26, 92, 168, 0.08)
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            OnSelect: =Navigate(ScrInventario, ScreenTransition.Fade)
      - RctCard2:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =691
            Y: =120
            Width: =659
            Height: =300
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =1
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
      - RctCard2Bar:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =691
            Y: =120
            Width: =6
            Height: =300
            Fill: =RGBA(247, 181, 0, 1)
            BorderThickness: =0
            RadiusTopLeft: =12
            RadiusBottomLeft: =12
      - LblCard2Title:
          Control: Label@2.2.1
          Properties:
            X: =707
            Y: =148
            Width: =627
            Height: =36
            Text: ="Prestamos Activos"
            Color: =RGBA(15, 61, 115, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =18
            FontWeight: =FontWeight.Bold
      - LblCard2Desc:
          Control: Label@2.2.1
          Properties:
            X: =707
            Y: =186
            Width: =627
            Height: =44
            Text: ="Gestiona prestamos de recursos y fechas de devolucion"
            Color: =RGBA(107, 112, 128, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =12
            Wrap: =true
      - LblCard2Stats:
          Control: Label@2.2.1
          Properties:
            X: =707
            Y: =262
            Width: =600
            Height: =30
            Text: =CountRows(gColPrestamos) & " prestamos · " & CountIf(gColPrestamos, estado="Vencido") & " vencidos"
            Color: =If(CountIf(gColPrestamos, estado="Vencido")>0, RGBA(204, 150, 0, 1), RGBA(107, 112, 128, 1))
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
      - BtnCard2:
          Control: Button@1.0.0
          Properties:
            X: =691
            Y: =120
            Width: =659
            Height: =300
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(247, 181, 0, 0.04)
            PressedFill: =RGBA(247, 181, 0, 0.08)
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            OnSelect: =Navigate(ScrPrestamos, ScreenTransition.Fade)
      - RctCard3:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =16
            Y: =432
            Width: =659
            Height: =300
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =1
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
      - RctCard3Bar:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =16
            Y: =432
            Width: =6
            Height: =300
            Fill: =RGBA(46, 123, 196, 1)
            BorderThickness: =0
            RadiusTopLeft: =12
            RadiusBottomLeft: =12
      - LblCard3Title:
          Control: Label@2.2.1
          Properties:
            X: =32
            Y: =460
            Width: =627
            Height: =36
            Text: ="Reservas de Sala"
            Color: =RGBA(15, 61, 115, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =18
            FontWeight: =FontWeight.Bold
      - LblCard3Desc:
          Control: Label@2.2.1
          Properties:
            X: =32
            Y: =498
            Width: =627
            Height: =44
            Text: ="Programa y consulta reservaciones de salas y laboratorios"
            Color: =RGBA(107, 112, 128, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =12
            Wrap: =true
      - LblCard3Stats:
          Control: Label@2.2.1
          Properties:
            X: =32
            Y: =570
            Width: =600
            Height: =30
            Text: =CountRows(gColReservas) & " reservas · " & CountIf(gColReservas, estado="Activa") & " activas"
            Color: =RGBA(107, 112, 128, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
      - BtnCard3:
          Control: Button@1.0.0
          Properties:
            X: =16
            Y: =432
            Width: =659
            Height: =300
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(46, 123, 196, 0.04)
            PressedFill: =RGBA(46, 123, 196, 0.08)
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            OnSelect: =Navigate(ScrReservas, ScreenTransition.Fade)
      - RctCard4:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =691
            Y: =432
            Width: =659
            Height: =300
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =1
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
      - RctCard4Bar:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =691
            Y: =432
            Width: =6
            Height: =300
            Fill: =RGBA(26, 92, 168, 1)
            BorderThickness: =0
            RadiusTopLeft: =12
            RadiusBottomLeft: =12
      - LblCard4Title:
          Control: Label@2.2.1
          Properties:
            X: =707
            Y: =460
            Width: =627
            Height: =36
            Text: ="Reportes y Estadisticas"
            Color: =RGBA(15, 61, 115, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =18
            FontWeight: =FontWeight.Bold
      - LblCard4Desc:
          Control: Label@2.2.1
          Properties:
            X: =707
            Y: =498
            Width: =627
            Height: =44
            Text: ="Visualiza estadisticas de uso de recursos por docente y categoria"
            Color: =RGBA(107, 112, 128, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =12
            Wrap: =true
      - LblCard4Stats:
          Control: Label@2.2.1
          Properties:
            X: =707
            Y: =570
            Width: =600
            Height: =30
            Text: ="Ver uso por articulo · semana · mes"
            Color: =RGBA(107, 112, 128, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
      - BtnCard4:
          Control: Button@1.0.0
          Properties:
            X: =691
            Y: =432
            Width: =659
            Height: =300
            Text: =""
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(26, 92, 168, 0.04)
            PressedFill: =RGBA(26, 92, 168, 0.08)
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            OnSelect: =Navigate(ScrReservas, ScreenTransition.Fade)
      - RctFooter:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =0
            Y: =740
            Width: =Parent.Width
            Height: =28
            Fill: =RGBA(228, 238, 249, 1)
            BorderThickness: =0
      - LblFooter:
          Control: Label@2.2.1
          Properties:
            X: =0
            Y: =740
            Width: =Parent.Width
            Height: =28
            Text: ="Universidad EAFIT · Escuela de Idiomas · Control de Recursos"
            Color: =RGBA(107, 112, 128, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =10
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
