Screens:
  ScrPrestamos:
    Control: Screen
    Properties:
      Fill: =RGBA(238, 244, 252, 1)
    Children:
      - RctHdrPres:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =64
            Fill: =RGBA(26, 92, 168, 1)
            BorderThickness: =0
      - BtnBackPres:
          Control: Button@1.0.0
          Properties:
            X: =12
            Y: =14
            Width: =36
            Height: =36
            Text: ="<"
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(255, 255, 255, 0.15)
            HoverFill: =RGBA(255, 255, 255, 0.25)
            PressedFill: =RGBA(255, 255, 255, 0.35)
            BorderColor: =RGBA(255, 255, 255, 0.3)
            BorderThickness: =1
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            FontWeight: =FontWeight.Bold
            Size: =16
            OnSelect: =Navigate(Screen1, ScreenTransition.Fade)
      - LblHdrPresSub:
          Control: Label@2.2.1
          Properties:
            X: =60
            Y: =8
            Width: =500
            Height: =20
            Text: ="Escuela de Idiomas · EAFIT"
            Color: =RGBA(255, 255, 255, 0.7)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
            FontWeight: =FontWeight.Semibold
      - LblHdrPresTitle:
          Control: Label@2.2.1
          Properties:
            X: =60
            Y: =26
            Width: =600
            Height: =30
            Text: ="Prestamos Activos"
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =17
            FontWeight: =FontWeight.Bold
      - RctSubPres:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =0
            Y: =64
            Width: =Parent.Width
            Height: =44
            Fill: =RGBA(15, 61, 115, 1)
            BorderThickness: =0
      - LblPresTot:
          Control: Label@2.2.1
          Properties:
            X: =20
            Y: =64
            Width: =200
            Height: =44
            Text: =CountRows(gColPrestamos) & " prestamos"
            Color: =RGBA(255, 255, 255, 0.9)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =12
            FontWeight: =FontWeight.Semibold
      - LblPresVencidos:
          Control: Label@2.2.1
          Properties:
            X: =230
            Y: =64
            Width: =240
            Height: =44
            Text: =CountIf(gColPrestamos, estado="Vencido") & " vencidos"
            Color: =RGBA(247, 181, 0, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =12
            FontWeight: =FontWeight.Semibold
      - TxtBuscarPres:
          Control: TextInput@2.3.2
          Properties:
            X: =16
            Y: =120
            Width: =900
            Height: =44
            HintText: ="Buscar por docente o articulo..."
            Default: =""
            Color: =RGBA(15, 61, 115, 1)
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =1
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            Size: =13
            PaddingLeft: =12
      - RctPresColHeader:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =16
            Y: =176
            Width: =Parent.Width - 32
            Height: =40
            Fill: =RGBA(255, 248, 225, 1)
            BorderThickness: =0
            RadiusTopLeft: =8
            RadiusTopRight: =8
      - LblPresColDoc:
          Control: Label@2.2.1
          Properties:
            X: =28
            Y: =176
            Width: =280
            Height: =40
            Text: ="Docente"
            Color: =RGBA(15, 61, 115, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
            FontWeight: =FontWeight.Bold
      - LblPresColArt:
          Control: Label@2.2.1
          Properties:
            X: =320
            Y: =176
            Width: =320
            Height: =40
            Text: ="Articulo"
            Color: =RGBA(15, 61, 115, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
            FontWeight: =FontWeight.Bold
      - LblPresColFechaDev:
          Control: Label@2.2.1
          Properties:
            X: =650
            Y: =176
            Width: =200
            Height: =40
            Text: ="Fecha Devolucion"
            Color: =RGBA(15, 61, 115, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
            FontWeight: =FontWeight.Bold
      - LblPresColEst:
          Control: Label@2.2.1
          Properties:
            X: =860
            Y: =176
            Width: =200
            Height: =40
            Text: ="Estado"
            Color: =RGBA(15, 61, 115, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =11
            FontWeight: =FontWeight.Bold
      - RctPresInfo:
          Control: Rectangle@2.3.0
          Variant: ManualInput
          Properties:
            X: =16
            Y: =228
            Width: =Parent.Width - 32
            Height: =480
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =1
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - LblPresGalleryHint:
          Control: Label@2.2.1
          Properties:
            X: =16
            Y: =228
            Width: =Parent.Width - 32
            Height: =480
            Text: ="Conecta una Galeria con Items: Search(gColPrestamos, TxtBuscarPres.Text, \"docente\", \"articulo\")" & Char(10) & Char(10) & "Total prestamos: " & CountRows(gColPrestamos) & Char(10) & "Activos: " & CountIf(gColPrestamos, estado="Activo") & Char(10) & "Vencidos: " & CountIf(gColPrestamos, estado="Vencido") & Char(10) & "Proximos: " & CountIf(gColPrestamos, estado="Próximo")
            Color: =RGBA(107, 112, 128, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Size: =13
            Wrap: =true
            PaddingLeft: =24
            PaddingTop: =24
            VerticalAlign: =VerticalAlign.Top
