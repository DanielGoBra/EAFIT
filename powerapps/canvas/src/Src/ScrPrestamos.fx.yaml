ScrPrestamos As screen:
    Fill: =RGBA(238, 244, 252, 1)

    RctHdrPres As rectangle.ManualInput:
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =64
        Fill: =RGBA(26, 92, 168, 1)
        BorderThickness: =0

    BtnBackPres As button.Button:
        X: =12
        Y: =14
        Width: =36
        Height: =36
        Text: ="<"
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(255, 255, 255, 0.15)
        HoverFill: =RGBA(255, 255, 255, 0.25)
        PressedFill: =RGBA(255, 255, 255, 0.35)
        BorderColor: =RGBA(255, 255, 255, 0.3)
        HoverBorderColor: =RGBA(255, 255, 255, 0.5)
        PressedBorderColor: =RGBA(255, 255, 255, 0.5)
        BorderThickness: =1
        RadiusTopLeft: =8
        RadiusTopRight: =8
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        FontWeight: =FontWeight.Bold
        Size: =16
        OnSelect: =Navigate(Screen1, ScreenTransition.Fade)

    LblHdrPresSub As label.Label:
        X: =60
        Y: =8
        Width: =500
        Height: =20
        Text: ="Escuela de Idiomas · EAFIT"
        Color: =RGBA(255, 255, 255, 0.7)
        Fill: =RGBA(0, 0, 0, 0)
        Size: =11
        FontWeight: =FontWeight.Semibold

    LblHdrPresTitle As label.Label:
        X: =60
        Y: =26
        Width: =600
        Height: =30
        Text: ="Prestamos de Recursos"
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Size: =17
        FontWeight: =FontWeight.Bold

    RctSubPres As rectangle.ManualInput:
        X: =0
        Y: =64
        Width: =Parent.Width
        Height: =44
        Fill: =RGBA(15, 61, 115, 1)
        BorderThickness: =0

    LblPresTotal As label.Label:
        X: =20
        Y: =64
        Width: =220
        Height: =44
        Text: =CountRows(gColPrestamos) & " prestamos"
        Color: =RGBA(255, 255, 255, 0.9)
        Fill: =RGBA(0, 0, 0, 0)
        Size: =12
        FontWeight: =FontWeight.Semibold

    LblPresVenc As label.Label:
        X: =250
        Y: =64
        Width: =240
        Height: =44
        Text: =CountIf(gColPrestamos, estado="Vencido") & " vencidos"
        Color: =If(CountIf(gColPrestamos, estado="Vencido")>0, RGBA(247, 181, 0, 1), RGBA(255, 255, 255, 0.6))
        Fill: =RGBA(0, 0, 0, 0)
        Size: =12
        FontWeight: =FontWeight.Semibold

    TxtBuscarPres As textInput.TextInput:
        X: =16
        Y: =120
        Width: =900
        Height: =44
        HintText: ="Buscar por docente o articulo..."
        Default: =""
        Color: =RGBA(15, 61, 115, 1)
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(226, 232, 240, 1)
        HoverBorderColor: =RGBA(247, 181, 0, 0.5)
        FocusedBorderColor: =RGBA(247, 181, 0, 1)
        BorderThickness: =1
        RadiusTopLeft: =8
        RadiusTopRight: =8
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        Size: =13
        PaddingLeft: =12

    RctPresColHeader As rectangle.ManualInput:
        X: =16
        Y: =176
        Width: =Parent.Width - 32
        Height: =40
        Fill: =RGBA(255, 248, 225, 1)
        BorderThickness: =0
        RadiusTopLeft: =8
        RadiusTopRight: =8

    LblPresColDoc As label.Label:
        X: =28
        Y: =176
        Width: =300
        Height: =40
        Text: ="Docente"
        Color: =RGBA(15, 61, 115, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Size: =11
        FontWeight: =FontWeight.Bold

    LblPresColArt As label.Label:
        X: =340
        Y: =176
        Width: =300
        Height: =40
        Text: ="Articulo"
        Color: =RGBA(15, 61, 115, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Size: =11
        FontWeight: =FontWeight.Bold

    LblPresColFecha As label.Label:
        X: =650
        Y: =176
        Width: =240
        Height: =40
        Text: ="Fecha Prestamo / Devolucion"
        Color: =RGBA(15, 61, 115, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Size: =11
        FontWeight: =FontWeight.Bold

    LblPresColEst As label.Label:
        X: =940
        Y: =176
        Width: =180
        Height: =40
        Text: ="Estado"
        Color: =RGBA(15, 61, 115, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Size: =11
        FontWeight: =FontWeight.Bold

    RctPresInfo As rectangle.ManualInput:
        X: =16
        Y: =228
        Width: =Parent.Width - 32
        Height: =480
        Fill: =RGBA(255, 255, 255, 1)
        BorderColor: =RGBA(226, 232, 240, 1)
        BorderThickness: =1
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =8
        RadiusBottomRight: =8

    LblPresGalleryHint As label.Label:
        X: =16
        Y: =228
        Width: =Parent.Width - 32
        Height: =480
        Text: ="Conecta una Galeria de Power Apps con Items: Search(gColPrestamos, TxtBuscarPres.Text, docente, articulo)" & Char(10) & Char(10) & "Prestamos activos: " & CountIf(gColPrestamos, estado="Activo") & Char(10) & "Vencidos: " & CountIf(gColPrestamos, estado="Vencido") & Char(10) & "Por vencer (Proximo): " & CountIf(gColPrestamos, estado="Proximo")
        Color: =RGBA(107, 112, 128, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Size: =13
        Wrap: =true
        PaddingLeft: =24
        PaddingTop: =24
        VerticalAlign: =VerticalAlign.Top
