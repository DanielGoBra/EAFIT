ScrCocina As screen:
    Fill: =RGBA(238, 244, 252, 1)
    LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    OnVisible: =If(!(gRol="Admin" || gRol="SuperAdmin"),Notify("No tienes permisos para ver inventario de cocina.",NotificationType.Error);Navigate(Screen1,ScreenTransition.None))

    RctActBarCo As rectangle.ManualInput:
        BorderColor: =RGBA(203, 213, 225, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =72
        Visible: =!IsBlank(DataTable1.Selected.Elemento)
        Width: =Parent.Width
        Y: =Parent.Height - 72

    LblActNameCo As label.Label:
        Color: =RGBA(15, 61, 115, 1)
        FontWeight: =FontWeight.Semibold
        Height: =72
        Size: =12
        Text: =DataTable1.Selected.Elemento
        Visible: =!IsBlank(DataTable1.Selected.Elemento)
        Width: =Parent.Width - 168
        X: =16
        Y: =Parent.Height - 72

    RctEditBtnCo As rectangle.ManualInput:
        Fill: =RGBA(26, 92, 168, 1)
        Height: =44
        OnSelect: =Set(gItemEdit,DataTable1.Selected);Navigate(ScrItemFormCocina,ScreenTransition.None)
        RadiusBottomLeft: =6
        RadiusBottomRight: =6
        RadiusTopLeft: =6
        RadiusTopRight: =6
        Visible: =!IsBlank(DataTable1.Selected.Elemento) && gRol <> "Docente"
        Width: =68
        X: =Parent.Width - 156
        Y: =Parent.Height - 72 + 14

    LblEditBtnCo As label.Label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Semibold
        Height: =44
        OnSelect: =Set(gItemEdit,DataTable1.Selected);Navigate(ScrItemFormCocina,ScreenTransition.None)
        Size: =11
        Text: ="✏ Editar"
        Visible: =!IsBlank(DataTable1.Selected.Elemento) && gRol <> "Docente"
        Width: =68
        X: =Parent.Width - 156
        Y: =Parent.Height - 72 + 14

    RctDelBtnCo As rectangle.ManualInput:
        Fill: =RGBA(8, 32, 70, 1)
        Height: =44
        OnSelect: =Set(gItemEdit,DataTable1.Selected);Set(gConfirmDelInv,true)
        RadiusBottomLeft: =6
        RadiusBottomRight: =6
        RadiusTopLeft: =6
        RadiusTopRight: =6
        Visible: =!IsBlank(DataTable1.Selected.Elemento) && gRol = "SuperAdmin"
        Width: =64
        X: =Parent.Width - 80
        Y: =Parent.Height - 72 + 14

    LblDelBtnCo As label.Label:
        Align: =Align.Center
        Color: =RGBA(247, 181, 0, 1)
        FontWeight: =FontWeight.Semibold
        Height: =44
        OnSelect: =Set(gItemEdit,DataTable1.Selected);Set(gConfirmDelInv,true)
        Size: =11
        Text: ="🗑 Borrar"
        Visible: =!IsBlank(DataTable1.Selected.Elemento) && gRol = "SuperAdmin"
        Width: =64
        X: =Parent.Width - 80
        Y: =Parent.Height - 72 + 14

    RctDelOvlCo As rectangle.ManualInput:
        Fill: =RGBA(0, 0, 0, 0.55)
        Height: =Parent.Height
        Visible: =gConfirmDelInv
        Width: =Parent.Width

    RctDelCardCo As rectangle.ManualInput:
        Fill: =RGBA(255, 255, 255, 1)
        Height: =170
        RadiusBottomLeft: =12
        RadiusBottomRight: =12
        RadiusTopLeft: =12
        RadiusTopRight: =12
        Visible: =gConfirmDelInv
        Width: =310
        X: =(Parent.Width-310)/2
        Y: =(Parent.Height-170)/2

    LblDelMsgCo As label.Label:
        Align: =Align.Center
        Color: =RGBA(26, 39, 66, 1)
        Height: =64
        PaddingTop: =6
        Size: =12
        Text: ="¿Eliminar """ & gItemEdit.Elemento & """?" & Char(10) & "Esta acción no se puede deshacer."
        VerticalAlign: =VerticalAlign.Top
        Visible: =gConfirmDelInv
        Width: =278
        X: =(Parent.Width-278)/2
        Y: =(Parent.Height-170)/2+16

    RctDelYesCo As rectangle.ManualInput:
        Fill: =RGBA(8, 32, 70, 1)
        Height: =40
        OnSelect: =Remove(Cocina,gItemEdit);Set(gConfirmDelInv,false);Set(gItemEdit,Blank())
        RadiusBottomLeft: =6
        RadiusBottomRight: =6
        RadiusTopLeft: =6
        RadiusTopRight: =6
        Visible: =gConfirmDelInv
        Width: =130
        X: =(Parent.Width-310)/2+16
        Y: =(Parent.Height-170)/2+96

    LblDelYesCo As label.Label:
