ScrPrestamos As screen:
    Fill: =RGBA(238, 244, 252, 1)
    OnVisible: |-
        =ForAll(Filter(Prestamos,Estado="Activo" && !IsBlank(FechaDevolucionEsperada) && DateTimeValue(FechaDevolucionEsperada)<Now()),Patch(Prestamos,ThisRecord,{Estado:"Vencido"}));Refresh(Prestamos)

    RctHdrPst As rectangle.ManualInput:
        Fill: =RGBA(15, 61, 115, 1)
        Height: =72
        Width: =Parent.Width

    RctBackPst As rectangle.ManualInput:
        Fill: =RGBA(46, 123, 196, 1)
        Height: =40
        OnSelect: =Navigate(Screen1,ScreenTransition.None)
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Width: =44
        X: =4
        Y: =16

    LblBackPst As label.Label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        OnSelect: =Navigate(Screen1,ScreenTransition.None)
        Size: =18
        Text: ="<-"
        Width: =44
        X: =4
        Y: =16

    LblTitlePst As label.Label:
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Bold
        Height: =72
        Size: =17
        Text: =If(gRol="Docente","Mis prestamos","Retiros y devoluciones")
        Width: =Parent.Width - 68
        X: =58

    RctAccentPst As rectangle.ManualInput:
        Fill: =RGBA(247, 181, 0, 1)
        Height: =3
        Width: =Parent.Width
        Y: =72

    RctFltTodosPst As rectangle.ManualInput:
        BorderColor: =RGBA(26, 92, 168, 1)
        BorderThickness: =1
        Fill: =If(gFiltroPrestamo="Todos",RGBA(26, 92, 168, 1),RGBA(255, 255, 255, 1))
        Height: =36
        OnSelect: =Set(gFiltroPrestamo,"Todos")
        RadiusBottomLeft: =6
        RadiusBottomRight: =6
        RadiusTopLeft: =6
        RadiusTopRight: =6
        Width: =(Parent.Width - 56) / 4
        X: =20
        Y: =84

    LblFltTodosPst As label.Label:
        Align: =Align.Center
        Color: =If(gFiltroPrestamo="Todos",RGBA(255, 255, 255, 1),RGBA(26, 92, 168, 1))
        FontWeight: =FontWeight.Semibold
        Height: =36
        OnSelect: =Set(gFiltroPrestamo,"Todos")
        Size: =11
        Text: ="Todos"
        Width: =(Parent.Width - 56) / 4
        X: =20
        Y: =84

    RctFltActivoPst As rectangle.ManualInput:
        BorderColor: =RGBA(26, 92, 168, 1)
        BorderThickness: =1
        Fill: =If(gFiltroPrestamo="Activo",RGBA(26, 92, 168, 1),RGBA(255, 255, 255, 1))
        Height: =36
        OnSelect: =Set(gFiltroPrestamo,"Activo")
        RadiusBottomLeft: =6
        RadiusBottomRight: =6
        RadiusTopLeft: =6
        RadiusTopRight: =6
        Width: =(Parent.Width - 56) / 4
        X: =20 + 1 * ((Parent.Width - 56) / 4 + 8)
        Y: =84

    LblFltActivoPst As label.Label:
        Align: =Align.Center
        Color: =If(gFiltroPrestamo="Activo",RGBA(255, 255, 255, 1),RGBA(26, 92, 168, 1))
        FontWeight: =FontWeight.Semibold
        Height: =36
        OnSelect: =Set(gFiltroPrestamo,"Activo")
        Size: =11
        Text: ="Activos"
        Width: =(Parent.Width - 56) / 4
        X: =20 + 1 * ((Parent.Width - 56) / 4 + 8)
        Y: =84

    RctFltVencidoPst As rectangle.ManualInput:
        BorderColor: =RGBA(26, 92, 168, 1)
        BorderThickness: =1
        Fill: =If(gFiltroPrestamo="Vencido",RGBA(26, 92, 168, 1),RGBA(255, 255, 255, 1))
        Height: =36
        OnSelect: =Set(gFiltroPrestamo,"Vencido")
        RadiusBottomLeft: =6
        RadiusBottomRight: =6
        RadiusTopLeft: =6
        RadiusTopRight: =6
        Width: =(Parent.Width - 56) / 4
        X: =20 + 2 * ((Parent.Width - 56) / 4 + 8)
        Y: =84

    LblFltVencidoPst As label.Label:
        Align: =Align.Center
        Color: =If(gFiltroPrestamo="Vencido",RGBA(255, 255, 255, 1),RGBA(26, 92, 168, 1))
        FontWeight: =FontWeight.Semibold
        Height: =36
        OnSelect: =Set(gFiltroPrestamo,"Vencido")
        Size: =11
        Text: ="Vencidos"
        Width: =(Parent.Width - 56) / 4
        X: =20 + 2 * ((Parent.Width - 56) / 4 + 8)
        Y: =84

    RctFltDevueltoPst As rectangle.ManualInput:
        BorderColor: =RGBA(26, 92, 168, 1)
        BorderThickness: =1
        Fill: =If(gFiltroPrestamo="Devuelto",RGBA(26, 92, 168, 1),RGBA(255, 255, 255, 1))
        Height: =36
        OnSelect: =Set(gFiltroPrestamo,"Devuelto")
        RadiusBottomLeft: =6
        RadiusBottomRight: =6
        RadiusTopLeft: =6
        RadiusTopRight: =6
        Width: =(Parent.Width - 56) / 4
        X: =20 + 3 * ((Parent.Width - 56) / 4 + 8)
        Y: =84

    LblFltDevueltoPst As label.Label:
        Align: =Align.Center
        Color: =If(gFiltroPrestamo="Devuelto",RGBA(255, 255, 255, 1),RGBA(26, 92, 168, 1))
        FontWeight: =FontWeight.Semibold
        Height: =36
        OnSelect: =Set(gFiltroPrestamo,"Devuelto")
        Size: =11
        Text: ="Devueltos"
        Width: =(Parent.Width - 56) / 4
        X: =20 + 3 * ((Parent.Width - 56) / 4 + 8)
        Y: =84

    RctFabPst As rectangle.ManualInput:
        Fill: =RGBA(26, 92, 168, 1)
        Height: =56
        OnSelect: =Set(gItemEdit,Blank());Navigate(ScrItemFormPrestamo,ScreenTransition.None)
        RadiusBottomLeft: =28
        RadiusBottomRight: =28
        RadiusTopLeft: =28
        RadiusTopRight: =28
        Visible: =gRol="Admin" || gRol="SuperAdmin"
        Width: =56
        X: =Parent.Width - 76
        Y: =Parent.Height - 76

    LblFabPst As label.Label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Bold
        Height: =56
        OnSelect: =Set(gItemEdit,Blank());Navigate(ScrItemFormPrestamo,ScreenTransition.None)
        Size: =28
        Text: ="+"
        Visible: =gRol="Admin" || gRol="SuperAdmin"
        Width: =56
        X: =Parent.Width - 76
        Y: =Parent.Height - 76

    RctActBarPst As rectangle.ManualInput:
        BorderColor: =RGBA(203, 213, 225, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =72
        Visible: =!IsBlank(DataTable4.Selected.NumeroTransaccion)
        Width: =Parent.Width
        Y: =Parent.Height - 72

    LblActNamePst As label.Label:
        Color: =RGBA(15, 61, 115, 1)
        FontWeight: =FontWeight.Semibold
        Height: =72
        Size: =12
        Text: =DataTable4.Selected.MaterialNombre & " · " & DataTable4.Selected.Estado
        Visible: =!IsBlank(DataTable4.Selected.NumeroTransaccion)
        Width: =Parent.Width - 168
        X: =16
        Y: =Parent.Height - 72

    RctEditBtnPst As rectangle.ManualInput:
        Fill: =RGBA(26, 92, 168, 1)
        Height: =44
        OnSelect: =Set(gItemEdit,DataTable4.Selected);Navigate(ScrItemFormPrestamo,ScreenTransition.None)
        RadiusBottomLeft: =6
        RadiusBottomRight: =6
        RadiusTopLeft: =6
        RadiusTopRight: =6
        Visible: =!IsBlank(DataTable4.Selected.NumeroTransaccion) && gRol <> "Docente"
        Width: =68
        X: =Parent.Width - 156
        Y: =Parent.Height - 58

    LblEditBtnPst As label.Label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Semibold
        Height: =44
        OnSelect: =Set(gItemEdit,DataTable4.Selected);Navigate(ScrItemFormPrestamo,ScreenTransition.None)
        Size: =11
        Text: ="Abrir"
        Visible: =!IsBlank(DataTable4.Selected.NumeroTransaccion) && gRol <> "Docente"
        Width: =68
        X: =Parent.Width - 156
        Y: =Parent.Height - 58

    DataTable4 As dataTable.datatable:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.Solid
        Color: =RGBA(50, 49, 48, 1)
        DisabledColor: =RGBA(161, 159, 157, 1)
        DisplayMode: =DisplayMode.Edit
        Fill: =RGBA(0, 0, 0, 0)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Normal
        HeadingColor: =RGBA(255, 255, 255, 1)
        HeadingFill: =RGBA(15, 61, 115, 1)
        HeadingFont: =Font.'Segoe UI'
        HeadingFontWeight: =FontWeight.Normal
        HeadingSize: =13
        Height: =Parent.Height - 136 - 80
        HoverColor: =RGBA(15, 61, 115, 1)
        HoverFill: =RGBA(220, 232, 248, 1)
        InputFill: =RGBA(245, 245, 245, 1)
        InvertedColor: =RGBA(255, 255, 255, 1)
        Items: =SortByColumns(If(gFiltroPrestamo="Todos",If(gRol="Docente",Filter(Prestamos,DocenteEmail=User().Email),Prestamos),Filter(If(gRol="Docente",Filter(Prestamos,DocenteEmail=User().Email),Prestamos),Estado=gFiltroPrestamo)),"FechaRetiro",SortOrder.Descending)
        LinkColor: =RGBA(0, 120, 212, 1)
        PrimaryColor1: =RGBA(26, 92, 168, 1)
        PrimaryColor2: =RGBA(46, 123, 196, 1)
        PrimaryColor3: =RGBA(15, 61, 115, 1)
        SelectedColor: =RGBA(15, 61, 115, 1)
        SelectedFill: =RGBA(220, 232, 248, 1)
        Size: =13
        Width: =Parent.Width
        X: =0
        Y: =136
        ZIndex: =1

        DataTable4_NumeroTransaccion_Columna1 As dataTableColumn.textualColumn:
            DisplayMode: =DisplayMode.Edit
            FieldDisplayName: ="Transaccion"
            FieldName: ="NumeroTransaccion"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            LayoutHeight: =Parent.Height
            Order: =1
            Text: =ThisItem.NumeroTransaccion
            Width: =180
            X: =0
            Y: =0
            ZIndex: =0

        DataTable4_MaterialNombre_Columna2 As dataTableColumn.textualColumn:
            DisplayMode: =DisplayMode.Edit
            FieldDisplayName: ="Material"
            FieldName: ="MaterialNombre"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            LayoutHeight: =Parent.Height
            Order: =2
            Text: =ThisItem.MaterialNombre
            Width: =220
            X: =0
            Y: =0
            ZIndex: =0

        DataTable4_DocenteNombre_Columna3 As dataTableColumn.textualColumn:
            DisplayMode: =DisplayMode.Edit
            FieldDisplayName: ="Docente"
            FieldName: ="DocenteNombre"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            LayoutHeight: =Parent.Height
            Order: =3
            Text: =ThisItem.DocenteNombre
            Width: =200
            X: =0
            Y: =0
            ZIndex: =0

        DataTable4_FechaDevolucionEsperada_Columna4 As dataTableColumn.textualColumn:
            DisplayMode: =DisplayMode.Edit
            FieldDisplayName: ="Devolucion esperada"
            FieldName: ="FechaDevolucionEsperada"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            LayoutHeight: =Parent.Height
            Order: =4
            Text: =ThisItem.FechaDevolucionEsperada
            Width: =200
            X: =0
            Y: =0
            ZIndex: =0

        DataTable4_Estado_Columna5 As dataTableColumn.textualColumn:
            DisplayMode: =DisplayMode.Edit
            FieldDisplayName: ="Estado"
            FieldName: ="Estado"
            FieldVariantName: ="textualColumn"
            Height: =Parent.Height
            LayoutHeight: =Parent.Height
            Order: =5
            Text: =ThisItem.Estado
            Width: =120
            X: =0
            Y: =0
            ZIndex: =0

