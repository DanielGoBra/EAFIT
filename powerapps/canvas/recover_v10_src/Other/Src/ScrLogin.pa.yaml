Screens:
  ScrLogin:
    Properties:
      Fill: =RGBA(15, 61, 115, 1)
      LoadingSpinnerColor: =RGBA(247, 181, 0, 1)
      OnVisible: =If(EndsWith(Lower(User().Email), "@eafit.edu.co"), Navigate(Screen1, ScreenTransition.Fade))
    Children:
      - RctLoginCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =428
            Width: =500
            X: =(Parent.Width - 500) / 2
            Y: =(Parent.Height - 428) / 2
      - RctLoginAccent:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(247, 181, 0, 1)
            Height: =6
            Width: =500
            X: =(Parent.Width - 500) / 2
            Y: =(Parent.Height - 428) / 2
      - LblLoginEafit:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(15, 61, 115, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =22
            Text: ="UNIVERSIDAD EAFIT"
            Width: =500
            X: =(Parent.Width - 500) / 2
            Y: =(Parent.Height - 428) / 2 + 20
      - LblLoginSub:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(107, 112, 128, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Text: ="Control de Idiomas · Laboratorio"
            Width: =500
            X: =(Parent.Width - 500) / 2
            Y: =(Parent.Height - 428) / 2 + 64
      - RctDiv1L:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(203, 213, 225, 1)
            Height: =1
            Width: =452
            X: =(Parent.Width - 500) / 2+24
            Y: =(Parent.Height - 428) / 2+100
      - LblLoginLb:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(107, 112, 128, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            Height: =20
            Size: =11
            Text: ="Sesión iniciada como:"
            Width: =452
            X: =(Parent.Width - 500) / 2+24
            Y: =(Parent.Height - 428) / 2+112
      - LblLoginName:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(26, 39, 66, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =34
            Size: =16
            Text: =User().FullName
            Width: =452
            X: =(Parent.Width - 500) / 2+24
            Y: =(Parent.Height - 428) / 2+134
      - LblLoginEmail:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(107, 112, 128, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Text: =User().Email
            Width: =452
            X: =(Parent.Width - 500) / 2+24
            Y: =(Parent.Height - 428) / 2+168
      - RctDiv2L:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(203, 213, 225, 1)
            Height: =1
            Width: =452
            X: =(Parent.Width - 500) / 2+24
            Y: =(Parent.Height - 428) / 2+200
      - RctDomainOk:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(46, 123, 196, 1)
            BorderThickness: =1
            Fill: =RGBA(238, 244, 252, 1)
            Height: =40
            Visible: =EndsWith(Lower(User().Email), "@eafit.edu.co")
            Width: =452
            X: =(Parent.Width - 500) / 2+24
            Y: =(Parent.Height - 428) / 2+212
      - RctDomainErr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(247, 181, 0, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 248, 220, 1)
            Height: =40
            Visible: =Not(EndsWith(Lower(User().Email), "@eafit.edu.co"))
            Width: =452
            X: =(Parent.Width - 500) / 2+24
            Y: =(Parent.Height - 428) / 2+212
      - LblDomainOk:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(26, 92, 168, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Text: ="✓  Cuenta institucional @eafit.edu.co verificada"
            Visible: =EndsWith(Lower(User().Email), "@eafit.edu.co")
            Width: =428
            X: =(Parent.Width - 500) / 2+36
            Y: =(Parent.Height - 428) / 2+212
      - LblDomainErr:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(204, 150, 0, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Text: ="⚠  Acceso restringido a cuentas @eafit.edu.co"
            Visible: =Not(EndsWith(Lower(User().Email), "@eafit.edu.co"))
            Width: =428
            X: =(Parent.Width - 500) / 2+36
            Y: =(Parent.Height - 428) / 2+212
      - RctBgGrad:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(8, 32, 70, 1)
            Height: =Parent.Height * 0.45
            Width: =Parent.Width
            Y: =Parent.Height * 0.55
      - RctAccessBtn:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =If(EndsWith(Lower(User().Email), "@eafit.edu.co"),RGBA(26, 92, 168, 1),RGBA(229, 231, 235, 1))
            Height: =44
            OnSelect: =If(EndsWith(Lower(User().Email), "@eafit.edu.co"), Navigate(Screen1, ScreenTransition.Fade))
            Width: =452
            X: =(Parent.Width - 500) / 2+24
            Y: =(Parent.Height - 428) / 2+268
      - LblAccessBtn:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =If(EndsWith(Lower(User().Email), "@eafit.edu.co"),RGBA(255, 255, 255, 1),RGBA(107, 112, 128, 1))
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =44
            OnSelect: =If(EndsWith(Lower(User().Email), "@eafit.edu.co"), Navigate(Screen1, ScreenTransition.Fade))
            Size: =15
            Text: =If(EndsWith(Lower(User().Email), "@eafit.edu.co"),"Acceder al sistema  →","Sin acceso")
            Width: =452
            X: =(Parent.Width - 500) / 2+24
            Y: =(Parent.Height - 428) / 2+268
      - LblLoginHint:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(107, 112, 128, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            Height: =20
            Size: =11
            Text: =If(EndsWith(Lower(User().Email), "@eafit.edu.co"),"Ingreso automático habilitado","Contacte al administrador del sistema")
            Width: =500
            X: =(Parent.Width - 500) / 2
            Y: =(Parent.Height - 428) / 2+322
      - LblLoginFooter:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(107, 112, 128, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            Height: =28
            Size: =10
            Text: ="© 2026 Universidad EAFIT  ·  Medellín, Colombia"
            Width: =500
            X: =(Parent.Width - 500) / 2
            Y: =(Parent.Height - 428) / 2+428-32
