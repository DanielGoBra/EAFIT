Screens:
  ScrUsuarios:
    Properties:
      Fill: =RGBA(238, 244, 252, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
    Children:
      - RctHdrUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(15, 61, 115, 1)
            Height: =72
            Width: =Parent.Width
      - RctDelOvlUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(0, 0, 0, 0.55)
            Height: =Parent.Height
            Visible: =gConfirmDelInv
            Width: =Parent.Width
      - RctDelCardUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =170
            Visible: =gConfirmDelInv
            Width: =310
            X: =(Parent.Width-310)/2
            Y: =(Parent.Height-170)/2
      - LblDelMsgUsr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(26, 39, 66, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            Height: =64
            PaddingTop: =6
            Size: =12
            Text: ="¿Eliminar """ & gItemEdit.Email & """?" & Char(10) & "Esta acción no se puede deshacer."
            VerticalAlign: =VerticalAlign.Top
            Visible: =gConfirmDelInv
            Width: =278
            X: =(Parent.Width-278)/2
            Y: =(Parent.Height-170)/2+16
      - RctDelYesUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(8, 32, 70, 1)
            Height: =40
            OnSelect: =Remove(Usuarios;gItemEdit);;Set(gConfirmDelInv;false);;Set(gItemEdit;Blank())
            Visible: =gConfirmDelInv
            Width: =130
            X: =(Parent.Width-310)/2+16
            Y: =(Parent.Height-170)/2+96
      - LblDelYesUsr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(247, 181, 0, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            OnSelect: =Remove(Usuarios;gItemEdit);;Set(gConfirmDelInv;false);;Set(gItemEdit;Blank())
            Size: =12
            Text: ="Eliminar"
            Visible: =gConfirmDelInv
            Width: =130
            X: =(Parent.Width-310)/2+16
            Y: =(Parent.Height-170)/2+96
      - RctDelNoUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(229, 231, 235, 1)
            Height: =40
            OnSelect: =Set(gConfirmDelInv,false)
            Visible: =gConfirmDelInv
            Width: =130
            X: =(Parent.Width-310)/2+164
            Y: =(Parent.Height-170)/2+96
      - LblDelNoUsr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(26, 39, 66, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            OnSelect: =Set(gConfirmDelInv,false)
            Size: =12
            Text: ="Cancelar"
            Visible: =gConfirmDelInv
            Width: =130
            X: =(Parent.Width-310)/2+164
            Y: =(Parent.Height-170)/2+96
      - RctFabMaskUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(238, 244, 252, 1)
            Height: =64
            Visible: =gRol = "Docente"
            Width: =64
            X: =Parent.Width - 80
            Y: =Parent.Height - 80
      - RctFabUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(26, 92, 168, 1)
            Height: =56
            OnSelect: =Set(gItemEdit,Blank());Navigate(ScrItemFormUsuario,ScreenTransition.Slide)
            Width: =56
            X: =Parent.Width - 76
            Y: =Parent.Height - 76
      - LblFabUsr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =56
            OnSelect: =Set(gItemEdit,Blank());Navigate(ScrItemFormUsuario,ScreenTransition.Slide)
            Size: =28
            Text: ="+"
            Width: =56
            X: =Parent.Width - 76
            Y: =Parent.Height - 76
      - RctFabActUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =56
            OnSelect: =Set(gItemEdit,Blank());Navigate(ScrItemFormUsuario,ScreenTransition.Slide)
            Visible: =gRol <> "Docente"
            Width: =56
            X: =Parent.Width - 76
            Y: =Parent.Height - 76
      - RctActBarUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(203, 213, 225, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =72
            Visible: =!IsBlank(DataTable5.Selected.Email)
            Width: =Parent.Width
            Y: =Parent.Height - 72
      - RctEditBtnUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(26, 92, 168, 1)
            Height: =44
            OnSelect: =Set(gItemEdit,DataTable5.Selected);Navigate(ScrItemFormUsuario,ScreenTransition.Slide)
            Visible: =!IsBlank(DataTable5.Selected.Email) && gRol <> "Docente"
            Width: =68
            X: =Parent.Width - 156
            Y: =Parent.Height - 72 + 14
      - LblEditBtnUsr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =44
            OnSelect: =Set(gItemEdit,DataTable5.Selected);Navigate(ScrItemFormUsuario,ScreenTransition.Slide)
            Size: =11
            Text: ="✏ Editar"
            Visible: =!IsBlank(DataTable5.Selected.Email) && gRol <> "Docente"
            Width: =68
            X: =Parent.Width - 156
            Y: =Parent.Height - 72 + 14
      - RctDelBtnUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(8, 32, 70, 1)
            Height: =44
            OnSelect: =Set(gItemEdit,DataTable5.Selected);Set(gConfirmDelInv,true)
            Visible: =!IsBlank(DataTable5.Selected.Email) && gRol = "SuperAdmin"
            Width: =64
            X: =Parent.Width - 80
            Y: =Parent.Height - 72 + 14
      - LblDelBtnUsr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(247, 181, 0, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =44
            OnSelect: =Set(gItemEdit,DataTable5.Selected);Set(gConfirmDelInv,true)
            Size: =11
            Text: |-
              ="🗑 Borrar"
            Visible: =!IsBlank(DataTable5.Selected.Email) && gRol = "SuperAdmin"
            Width: =64
            X: =Parent.Width - 80
            Y: =Parent.Height - 72 + 14
      - LblActNameUsr:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(15, 61, 115, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =72
            Size: =12
            Text: =DataTable5.Selected.Email
            Visible: =!IsBlank(DataTable5.Selected.Email)
            Width: =Parent.Width - 168
            X: =16
            Y: =Parent.Height - 72
      - LblTitleUsr:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =72
            Size: =17
            Text: ="Gestión de Usuarios"
            Width: =Parent.Width-68
            X: =58
      - RctBackUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(46, 123, 196, 1)
            Height: =40
            OnSelect: =Navigate(Screen1,ScreenTransition.Slide)
            Width: =44
            X: =4
            Y: =16
      - LblBackUsr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            OnSelect: =Navigate(Screen1,ScreenTransition.Slide)
            Size: =22
            Text: ="←"
            Width: =44
            X: =4
            Y: =16
      - RctAccentUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(247, 181, 0, 1)
            Height: =3
            Width: =Parent.Width
            Y: =72
      - TxtSearchUsr:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(203, 213, 225, 1)
            BorderThickness: =1
            Color: =RGBA(70, 68, 64, 1)
            Default: =""
            DisabledBorderColor: =ColorFade(Self.BorderColor, 40%)
            DisabledColor: =ColorFade(Self.Color, 40%)
            DisabledFill: =Self.Fill
            FocusedBorderThickness: =3
            Font: =Font.'Open Sans'
            Height: =38
            HintText: ="Buscar usuario..."
            HoverBorderColor: =Self.Color
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            PaddingLeft: =36
            PaddingRight: =10
            Size: =14
            Visible: =gRol = "SuperAdmin"
            Width: =Parent.Width-40
            X: =20
            Y: =83
      - LblSearchIcoUsr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(107, 112, 128, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            DisplayMode: =DisplayMode.View
            Font: =Font.'Open Sans'
            Height: =38
            Size: =14
            Text: |-
              ="🔍"
            Visible: =gRol = "SuperAdmin"
            Width: =28
            X: =26
            Y: =83
      - RctNoAccUsr:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(247, 181, 0, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 248, 220, 1)
            Height: =80
            Visible: =gRol <> "SuperAdmin"
            Width: =Parent.Width-40
            X: =20
            Y: =99
      - LblNoAccUsr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(204, 150, 0, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =80
            Text: ="⛔  Solo el SuperAdmin puede gestionar usuarios."
            Visible: =gRol <> "SuperAdmin"
            Width: =Parent.Width-64
            X: =32
            Y: =99
      - DataTable5:
          Control: DataTable@1.0.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.'Segoe UI'
            HeadingColor: =RGBA(255, 255, 255, 1)
            HeadingFill: =RGBA(15, 61, 115, 1)
            HeadingFont: =Font.'Segoe UI'
            Height: =Parent.Height - 121 - 80
            HoverColor: =RGBA(15, 61, 115, 1)
            HoverFill: =RGBA(220, 232, 248, 1)
            Items: =Usuarios
            SelectedColor: =RGBA(15, 61, 115, 1)
            SelectedFill: =RGBA(220, 232, 248, 1)
            Width: =Parent.Width
            Y: =121
          Children:
            - Activo_Columna1:
                Control: DataTableColumn@1.0.1
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Activo"
                  FieldName: ="Activo"
                  Order: =1
                  Text: =ThisItem.Activo
            - Email_Columna1:
                Control: DataTableColumn@1.0.1
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Email"
                  FieldName: ="Email"
                  Order: =2
                  Text: =ThisItem.Email
            - Nombre_Columna1:
                Control: DataTableColumn@1.0.1
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Nombre"
                  FieldName: ="Nombre"
                  Order: =3
                  Text: =ThisItem.Nombre
            - Rol_Columna1:
                Control: DataTableColumn@1.0.1
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Rol"
                  FieldName: ="Rol"
                  Order: =4
                  Text: =ThisItem.Rol
