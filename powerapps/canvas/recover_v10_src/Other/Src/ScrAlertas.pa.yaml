            Color: =RGBA(107, 112, 128, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            DisplayMode: =DisplayMode.View
            Font: =Font.'Open Sans'
            Height: =30
            Size: =11
            Text: ="Vence hoy"
            Width: =(Parent.Width - 56) / 3
            X: =20 + (Parent.Width - 56) / 3 + 8
            Y: =91+44
      - LblLOkAlt:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(107, 112, 128, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            DisplayMode: =DisplayMode.View
