            Height: =30
            Size: =11
            Text: ="Vencidos"
            Width: =(Parent.Width - 56) / 3
            X: =20
            Y: =91+44
      - DataTable6:
          Control: DataTable@1.0.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.'Segoe UI'
            HeadingColor: =RGBA(255, 255, 255, 1)
            HeadingFill: =RGBA(15, 61, 115, 1)
            HeadingFont: =Font.'Segoe UI'
            Height: =Parent.Height - 185
            HoverColor: =RGBA(15, 61, 115, 1)
            HoverFill: =RGBA(220, 232, 248, 1)
            Items: =Filter(Prestamos,Estado="Activo")
            SelectedColor: =RGBA(15, 61, 115, 1)
            SelectedFill: =RGBA(220, 232, 248, 1)
            Width: =Parent.Width
            Y: =185
          Children:
            - DataTable6_Item_Columna1:
                Control: DataTableColumn@1.0.1
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Artículo"
                  FieldName: ="Item"
                  Order: =1
                  Text: =ThisItem.Item
                  Width: =220
            - DataTable6_Usuario_Columna2:
                Control: DataTableColumn@1.0.1
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Docente"
                  FieldName: ="Usuario"
                  Order: =2
                  Text: =ThisItem.Usuario
                  Width: =220
            - DataTable6_Fecha_Columna3:
                Control: DataTableColumn@1.0.1
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Retiro"
                  FieldName: ="Fecha"
                  Order: =3
                  Text: =ThisItem.Fecha
                  Width: =150
            - DataTable6_FechaFin_Columna4:
                Control: DataTableColumn@1.0.1
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Dev. esperada"
                  FieldName: ="FechaFin"
                  Order: =4
                  Text: =ThisItem.FechaFin
                  Width: =150
