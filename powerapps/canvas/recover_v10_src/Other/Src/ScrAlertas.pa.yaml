Screens:
  ScrAlertas:
    Properties:
      Fill: =RGBA(238, 244, 252, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
    Children:
      - RctHdrAlt:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(15, 61, 115, 1)
            Height: =72
            Width: =Parent.Width
      - LblTitleAlt:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =72
            Size: =17
            Text: ="Alertas de Pendientes"
            Width: =Parent.Width-68
            X: =58
      - RctBackAlt:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(46, 123, 196, 1)
            Height: =40
            OnSelect: =Navigate(Screen1,ScreenTransition.Slide)
            Width: =44
            X: =4
            Y: =16
      - LblBackAlt:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            OnSelect: =Navigate(Screen1,ScreenTransition.Slide)
            Size: =22
            Text: ="←"
            Width: =44
            X: =4
            Y: =16
      - RctAccentAlt:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(247, 181, 0, 1)
            Height: =3
            Width: =Parent.Width
            Y: =72
      - RctHoyAlt:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(247, 181, 0, 1)
            BorderThickness: =2
            Fill: =RGBA(255, 255, 255, 1)
            Height: =80
            Width: =(Parent.Width - 56) / 3
            X: =20 + (Parent.Width - 56) / 3 + 8
            Y: =91
      - RctOkAlt:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(26, 92, 168, 1)
            BorderThickness: =2
            Fill: =RGBA(255, 255, 255, 1)
            Height: =80
            Width: =(Parent.Width - 56) / 3
            X: =20 + (Parent.Width - 56) / 3 * 2 + 16
            Y: =91
      - RctVenAlt:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(204, 150, 0, 1)
            BorderThickness: =2
            Fill: =RGBA(255, 255, 255, 1)
            Height: =80
            Width: =(Parent.Width - 56) / 3
            X: =20
            Y: =91
      - LblNHoyAlt:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(247, 181, 0, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            DisplayMode: =DisplayMode.View
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =28
            Text: =CountIf(Prestamos,Estado="Activo",Not(IsBlank(FechaFin)),FechaFin=Text(Today(),"yyyy-mm-dd"))
            Width: =(Parent.Width - 56) / 3
            X: =20 + (Parent.Width - 56) / 3 + 8
            Y: =95
      - LblNOkAlt:
